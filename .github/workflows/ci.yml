name: Validación

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verificar Docker
        run: docker info

      - name: Restaurar dependencias
        run: dotnet restore RestauranteVentas.slnx

      - name: Compilar en Release
        run: dotnet build RestauranteVentas.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas unitarias e integración con cobertura
        run: dotnet test RestauranteVentas.slnx --configuration Release --no-build --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
