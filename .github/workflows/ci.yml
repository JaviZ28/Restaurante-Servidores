name: Validación

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verificar Docker
        run: docker info

      - name: Restaurar dependencias
        run: dotnet restore RestauranteVentas.slnx

      - name: Compilar en Release
        run: dotnet build RestauranteVentas.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas de dominio con cobertura
        run: dotnet test tests/RestauranteVentas.Dominio.Tests/RestauranteVentas.Dominio.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Ejecutar pruebas de aplicación con cobertura
        run: dotnet test tests/RestauranteVentas.Aplicacion.Tests/RestauranteVentas.Aplicacion.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Ejecutar pruebas de arquitectura
        run: dotnet test tests/RestauranteVentas.Arquitectura.Tests/RestauranteVentas.Arquitectura.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Ejecutar pruebas de integración
        run: dotnet test tests/RestauranteVentas.IntegrationTests/RestauranteVentas.IntegrationTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
